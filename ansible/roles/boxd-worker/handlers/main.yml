- name: reload systemd
  systemd:
    daemon_reload: true

# The guest firewall is reapplied by a task, before any of these run (tasks/main.yml, "Reapply
# guest firewall when ..."): the worker's and the relay's ExecStartPre check the ruleset they
# are about to run under. The relay restarts only when its binary or unit changed: a restart
# cuts its open connections.
- name: restart boxd-relay
  systemd:
    name: boxd-relay
    state: restarted
    daemon_reload: true
  when: boxd_private_service_bounds | length > 0

- name: restart boxd service
  systemd:
    name: boxd-worker
    state: restarted
