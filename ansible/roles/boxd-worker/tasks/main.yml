- name: Locate host kernel deb in assets
  set_fact:
    host_kernel_deb: "{{ lookup('fileglob', boxd_assets_dir + '/kernel/linux-image-*.deb') }}"

- name: Warn when assets ship no host kernel
  debug:
    msg: >-
      assets zip has no kernel/linux-image-*.deb — worker stays on
      {{ ansible_kernel }}; live VM fork (import_cow_range) will not work.
  when: host_kernel_deb == "" and "boxd" not in ansible_kernel

# GRUB_DEFAULT=0 boots the highest-versioned kernel, so the pin must name the
# boxd kernel explicitly: Canonical's 24.04 AWS image ships 7.x, which outranks
# 6.17-boxd and silently wins the reboot. Applied even when the boxd kernel is
# already running, so a later stock-kernel upgrade can't take over the next boot.
- name: Pin grub default to the host kernel
  copy:
    dest: /etc/default/grub.d/99-boxd-host-kernel.cfg
    content: |
      GRUB_DEFAULT="Advanced options for Ubuntu>Ubuntu, with Linux {{ boxd_host_kernel_release }}"
    mode: "0644"
  register: host_kernel_grub_pin
  when:
    - host_kernel_deb != ""
    - boxd_host_kernel_release | default("") != ""

- name: Update grub for the kernel pin
  command: update-grub
  when:
    - host_kernel_grub_pin is changed
    - ansible_kernel == boxd_host_kernel_release

- name: Install patched host kernel
  when:
    - host_kernel_deb != ""
    - boxd_host_kernel_release | default("") != ""
    - ansible_kernel != boxd_host_kernel_release
  block:
    - name: Copy host kernel deb
      boxd_copy:
        src: "{{ host_kernel_deb }}"
        dest: "/tmp/{{ host_kernel_deb | basename }}"

    - name: Install host kernel package
      apt:
        deb: "/tmp/{{ host_kernel_deb | basename }}"

    - name: Update grub
      command: update-grub
      changed_when: true

    - name: Reboot into the patched kernel
      reboot:
        reboot_timeout: 600

    - name: Verify the pinned kernel is running
      command: uname -r
      register: post_reboot_kernel
      changed_when: false
      failed_when: post_reboot_kernel.stdout != boxd_host_kernel_release

- name: Install boxd-worker service
  import_role:
    name: boxd-common
    tasks_from: install-service
  vars:
    boxd_binary: boxd-worker
    boxd_service: boxd-worker
    boxd_role_name: worker
    boxd_config_mode: "0600"

# [storage_engine]: the engine's bucket file (render.storage_store), which
# worker.toml's [storage_engine.bucket] config names. 0600 and owned by boxd:
# boxd refuses a bucket file group or others can read (it holds the bucket's
# key on AWS and metal). Here, before the worker's first start below and its
# restart (handlers run last), so the worker never starts without it.
- name: Copy the storage engine's bucket config
  copy:
    src: "{{ boxd_config_local_dir }}/{{ inventory_hostname }}/bucket.toml"
    dest: "{{ boxd_config_dir }}/bucket.toml"
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0600"
  when: boxd_storage_engine | default(false) | bool
  notify: restart boxd service

# Without [storage_engine] (apply allows that only before the storage catalog
# was ever on): a bucket file left from before goes.
- name: Remove the bucket config without the storage engine
  file:
    path: "{{ boxd_config_dir }}/bucket.toml"
    state: absent
  when: not (boxd_storage_engine | default(false) | bool)
  notify: restart boxd service

- name: Install worker dependencies
  apt:
    name:
      - fakeroot
      - e2fsprogs
      - nftables          # boxd-guest-fw, and the worker's own inet boxd_egress
    state: present

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Worker memory tuning sysctls
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-boxd-worker.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: vm.swappiness, value: "100" }
    - { name: vm.overcommit_memory, value: "1" }
    - { name: vm.unprivileged_userfaultfd, value: "1" }

- name: Enable transparent hugepages + shmem THP + mTHP sizes
  copy:
    dest: /etc/tmpfiles.d/boxd-thp.conf
    content: |
      w /sys/kernel/mm/transparent_hugepage/enabled - - - - always
      w /sys/kernel/mm/transparent_hugepage/defrag - - - - always
      w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
      w /sys/kernel/mm/transparent_hugepage/hugepages-16kB/enabled - - - - inherit
      w /sys/kernel/mm/transparent_hugepage/hugepages-32kB/enabled - - - - inherit
      w /sys/kernel/mm/transparent_hugepage/hugepages-64kB/enabled - - - - inherit
      w /sys/kernel/mm/transparent_hugepage/hugepages-128kB/enabled - - - - inherit
      w /sys/kernel/mm/transparent_hugepage/hugepages-256kB/enabled - - - - inherit
      w /sys/kernel/mm/transparent_hugepage/hugepages-512kB/enabled - - - - inherit
      w /sys/kernel/mm/transparent_hugepage/hugepages-1024kB/enabled - - - - inherit
    owner: root
    group: root
    mode: "0644"

- name: Apply THP tmpfiles immediately
  command: systemd-tmpfiles --create /etc/tmpfiles.d/boxd-thp.conf
  changed_when: false

# [worker] ksm: KSM merges identical guest pages (same base image, same
# runtimes) and, with use_zero_pages, pages a guest has zeroed. ksmd splits
# the THPs it merges.
- name: Configure KSM
  copy:
    dest: /etc/tmpfiles.d/boxd-ksm.conf
    content: |
      w /sys/kernel/mm/ksm/pages_to_scan - - - - 4000
      w /sys/kernel/mm/ksm/sleep_millisecs - - - - 20
      w /sys/kernel/mm/ksm/use_zero_pages - - - - 1
      w /sys/kernel/mm/ksm/run - - - - 1
    owner: root
    group: root
    mode: "0644"
  when: boxd_worker_ksm | bool

# Turning ksm off takes effect at the next boot; to stop it now, run
# `echo 2 > /sys/kernel/mm/ksm/run` (it unmerges, so needs the memory back).
- name: Drop the KSM config when ksm is off
  file:
    path: /etc/tmpfiles.d/boxd-ksm.conf
    state: absent
  when: not (boxd_worker_ksm | bool)

- name: Apply KSM tmpfiles immediately
  command: systemd-tmpfiles --create /etc/tmpfiles.d/boxd-ksm.conf
  changed_when: false
  when: boxd_worker_ksm | bool

- name: Loosen perms on /dev/userfaultfd so boxd-vmm can open it
  copy:
    dest: /etc/tmpfiles.d/boxd-userfaultfd.conf
    content: |
      z /dev/userfaultfd 0666 - - -
    owner: root
    group: root
    mode: "0644"

- name: Apply userfaultfd tmpfiles immediately
  command: systemd-tmpfiles --create /etc/tmpfiles.d/boxd-userfaultfd.conf
  changed_when: false

- name: Check which swap files already exist
  stat:
    path: "{{ item.path }}"
    get_checksum: false
    get_attributes: false
    get_mime: false
  loop: "{{ boxd_worker_swapfiles }}"
  loop_control:
    label: "{{ item.path }}"
  register: swapfile_stat
  check_mode: false
  tags: [swap]

- name: Allocate new swap files
  command: fallocate -l {{ item.item.size }} {{ item.item.path }}
  loop: "{{ swapfile_stat.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not item.stat.exists
  tags: [swap]

- name: Set swap file permissions
  file:
    path: "{{ item.item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ swapfile_stat.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.stat.exists or not ansible_check_mode
  tags: [swap]

- name: mkswap on new swap files
  command: mkswap {{ item.item.path }}
  loop: "{{ swapfile_stat.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not item.stat.exists
  tags: [swap]

- name: List active swap devices
  command: swapon --show=NAME --noheadings
  register: active_swaps
  changed_when: false
  check_mode: false
  tags: [swap]

- name: Activate swap files that are not active yet
  command: "swapon {{ ('-p ' ~ item.priority ~ ' ') if item.priority is defined else '' }}{{ item.path }}"
  loop: "{{ boxd_worker_swapfiles }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path not in active_swaps.stdout_lines
  tags: [swap]

- name: Persist swap files in /etc/fstab
  lineinfile:
    path: /etc/fstab
    line: "{{ item.path }} none swap sw{{ (',pri=' ~ item.priority) if item.priority is defined else '' }} 0 0"
    regexp: '^{{ item.path | regex_escape }}\s'
    state: present
  loop: "{{ boxd_worker_swapfiles }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [swap]

- name: Bridge networking (boxd-br0, the VXLAN mesh)
  import_tasks: bridge-network.yml
  when: boxd_network_mode | default('bridge') != 'routed'

- name: Routed networking (geneve0, boxd0, the eBPF datapath; no bridge)
  import_tasks: routed-network.yml
  when: boxd_network_mode | default('bridge') == 'routed'

# No DNS rate limit on self-hosted workers: the per-machine and egress DNS limits
# (boxd-dns-ratelimit) protect boxd's managed cloud from floods, and on a cluster
# of one organization they only got in the way (on GKE they throttled the
# worker's own lookups and failed its bucket uploads). A host an older installer
# set up loses the service, the script and its rules.
- name: Remove the DNS rate-limit service (older installers)
  systemd:
    name: boxd-dns-ratelimit
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the DNS rate-limit files (older installers)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/boxd-dns-ratelimit.service
    - /usr/local/bin/boxd-dns-ratelimit.sh
  register: dns_ratelimit_files

- name: Reload systemd after removing the DNS rate-limit service
  systemd:
    daemon_reload: true
  when: dns_ratelimit_files.changed

- name: Remove the DNS rate-limit rules (older installers)
  shell: |
    set -e
    removed=0
    for chain in FORWARD OUTPUT; do
      { iptables -S "$chain" 2>/dev/null | grep -E -- '--hashlimit-name (dnsflood|dnsout)_' || true; } | sed 's/^-A /-D /' \
        | while read -r rule; do iptables $rule; echo removed; done
    done
  register: dns_ratelimit_rules
  changed_when: "'removed' in dns_ratelimit_rules.stdout"

# Guest firewall: an nftables ruleset keyed
# on the guest's tap, so guests reach the gateway's services (DNS, metadata,
# the VM proxy, egress), other guests, the proxies' device ingress and the
# internet, and nothing else of the infrastructure: not the worker's gRPC,
# not the control network, not the VPC, not the cloud metadata service. See
# files/boxd-guest-fw.sh (vendored from boxd) for the rules.
#
# The inputs are topology, so a converge is what changes them (adding a worker
# or a proxy converges every worker anyway). Bridge mode: this worker's /16
# and gateway, the other workers' /16s, and each proxy's on-link address on
# this /16, 10.N.0.(254 - its index), as roles/boxd-proxy assigns it. Routed
# mode: --routed, the pool and its gateway, and the proxies' host addresses in
# the pool (the same .254-downwards rule, render.py). Single-cluster topology
# only: no legacy gateways, no mixed bridge/routed workers.
- name: Compute guest firewall arguments
  set_fact:
    boxd_guest_fw_args: >-
      {% if boxd_network_mode | default('bridge') == 'routed' %}
      --routed
      {% endif %}
      --subnet {{ bridge_subnet }} --gateway {{ bridge_gateway }}
      {% if boxd_network_mode | default('bridge') != 'routed' %}
      {% for peer in boxd_workers | rejectattr('name', 'equalto', inventory_hostname) %}
      --peer-subnet {{ peer.bridge_subnet }}
      {% endfor %}
      {% endif %}
      {% for proxy in groups['proxy'] %}
      --proxy {{ bridge_subnet | regex_replace('0\.0/16$', '0.' ~ (254 - groups['proxy'].index(proxy))) }}
      {% endfor %}
      {% if boxd_private_service_bounds | length > 0 %}
      --relay-user boxd-relay
      {% for bound in boxd_private_service_bounds %}
      --private-service {{ bound }}
      {% endfor %}
      {% endif %}

# Before the firewall's first start: its relay chain matches `meta skuid
# "boxd-relay"`, which nft resolves when it loads the ruleset, so the load
# fails while the user doesn't exist.
- name: Relay user for private services
  user:
    name: boxd-relay
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: boxd_private_service_bounds | length > 0

- name: Install guest firewall script
  copy:
    src: boxd-guest-fw.sh  # vendored in this role's files/
    dest: /usr/local/bin/boxd-guest-fw
    mode: "0755"

- name: Install guest firewall systemd service
  copy:
    content: |
      [Unit]
      Description=boxd guest firewall (nftables, per tap)
      After=network-online.target boxd-vxlan.service
      Wants=network-online.target
      Before=boxd-worker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # No ExecStop: stopping must not unfilter guests. Remove by hand with
      # `boxd-guest-fw --remove`.
      ExecStart=/usr/local/bin/boxd-guest-fw {{ boxd_guest_fw_args | regex_replace('\s+', ' ') | trim }}
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/boxd-guest-fw.service
    mode: "0644"

- name: Enable + start guest firewall service
  systemd:
    name: boxd-guest-fw
    enabled: true
    state: started
    daemon_reload: true

# A changed script or unit (new --private-service bounds, a new peer subnet) reaches the kernel
# here: re-run the oneshot when either file is newer than its last start. One atomic nft batch
# replaces the tables, so guests are never unfiltered. Not a handler: a later task's failure
# drops a host's handlers, and the re-run, seeing both files unchanged, kept the old ruleset.
- name: Reapply guest firewall when its script or unit is newer than the loaded ruleset
  shell: |
    set -eu
    started=$(systemctl show boxd-guest-fw -p ActiveEnterTimestamp --value)
    [ -n "$started" ] || exit 0
    started=$(date -d "$started" +%s)
    for f in /usr/local/bin/boxd-guest-fw /etc/systemd/system/boxd-guest-fw.service; do
      if [ "$(stat -c %Y "$f")" -gt "$started" ]; then
        systemctl daemon-reload
        systemctl restart boxd-guest-fw
        echo reapplied
        exit 0
      fi
    done
  args:
    executable: /bin/bash
  register: boxd_guest_fw_reapply
  changed_when: "'reapplied' in boxd_guest_fw_reapply.stdout"

# Fail closed: boxd-worker starts only when the firewall's tables are loaded,
# so a firewall that failed at boot leaves the worker (and every VM) down
# rather than running guests unfiltered. An ExecStartPre check, not
# Requires=: Requires= would restart the worker every time the firewall is
# re-applied. Rolling back the firewall means removing this drop-in too.
- name: Ensure boxd-worker drop-in directory exists
  file:
    path: /etc/systemd/system/boxd-worker.service.d
    state: directory
    mode: "0755"

- name: Make boxd-worker require the guest firewall
  copy:
    content: |
      [Unit]
      Wants=boxd-guest-fw.service
      After=boxd-guest-fw.service
      [Service]
      ExecStartPre=/usr/local/bin/boxd-guest-fw --verify{{ ' --routed' if boxd_network_mode | default('bridge') == 'routed' else '' }}
    dest: /etc/systemd/system/boxd-worker.service.d/guest-fw.conf
    mode: "0644"
  notify: reload systemd

# The relay for private services ([[worker.private_services]]): its own unit and user, no
# capabilities, so it outlives worker restarts and holds none of the worker's privilege. The
# worker writes its state to /run/boxd/relay/state.json and reads its status file. Installed only
# when services are declared (boxd_private_service_bounds, from the installer); stopped and
# disabled otherwise. It does not start without the firewall's relay chain (ExecStartPre, run as
# root by the `+`), the firewall's second copy of where it may connect.
- name: Copy boxd-relay
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-relay"
    dest: /usr/local/bin/boxd-relay
    mode: preserve
  when: boxd_private_service_bounds | length > 0
  notify: restart boxd-relay

- name: Set boxd-relay permissions
  file:
    path: /usr/local/bin/boxd-relay
    mode: "0755"
    owner: root
    group: root
  when: boxd_private_service_bounds | length > 0

- name: Install the boxd-relay unit
  copy:
    content: |
      [Unit]
      Description=boxd relay for private services
      After=network-online.target boxd-guest-fw.service
      Wants=network-online.target boxd-guest-fw.service
      [Service]
      ExecStartPre=+/usr/local/bin/boxd-guest-fw --verify --relay-user boxd-relay{{ ' --routed' if boxd_network_mode | default('bridge') == 'routed' else '' }}
      ExecStart=/usr/local/bin/boxd-relay --state /run/boxd/relay/state.json --status /run/boxd-relay/status.json
      Environment=RUST_LOG=info NO_COLOR=1 BOXD_METRICS_LISTEN=127.0.0.1:9107
      User=boxd-relay
      Group=boxd-relay
      Restart=always
      RestartSec=1s
      RuntimeDirectory=boxd-relay
      LimitNOFILE=65536
      Slice=boxd.slice
      NoNewPrivileges=yes
      CapabilityBoundingSet=
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      RestrictAddressFamilies=AF_INET AF_UNIX AF_NETLINK
      RestrictNamespaces=yes
      LockPersonality=yes
      MemoryDenyWriteExecute=yes
      ProtectClock=yes
      ProtectKernelLogs=yes
      ProtectHostname=yes
      ProtectProc=invisible
      RestrictSUIDSGID=yes
      RestrictRealtime=yes
      RemoveIPC=yes
      SystemCallArchitectures=native
      SystemCallFilter=@system-service
      SystemCallFilter=~@privileged @resources
      # The status file is read by the worker (user boxd).
      UMask=0022
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/boxd-relay.service
    mode: "0644"
  when: boxd_private_service_bounds | length > 0
  notify: restart boxd-relay

# The firewall is re-applied by a handler at the end of the play; the relay refuses to start
# until the firewall holds its chain, so a first install applies it now (one atomic batch, it
# cuts nothing).
- name: Load the guest firewall's relay chain before the relay starts
  shell: |
    /usr/local/bin/boxd-guest-fw --verify --relay-user boxd-relay{{ ' --routed' if boxd_network_mode | default('bridge') == 'routed' else '' }} >/dev/null 2>&1 && exit 0
    systemctl daemon-reload && systemctl restart boxd-guest-fw && echo applied
  register: boxd_relay_chain
  changed_when: "'applied' in boxd_relay_chain.stdout"
  when: boxd_private_service_bounds | length > 0

- name: Enable + start boxd-relay
  systemd:
    name: boxd-relay
    enabled: true
    state: started
    daemon_reload: true
  when: boxd_private_service_bounds | length > 0

- name: Look for a boxd-relay unit left from private services
  stat:
    path: /etc/systemd/system/boxd-relay.service
  register: boxd_relay_unit
  when: boxd_private_service_bounds | length == 0

- name: Stop and disable boxd-relay (no private services)
  systemd:
    name: boxd-relay
    enabled: false
    state: stopped
  when: boxd_private_service_bounds | length == 0 and boxd_relay_unit.stat.exists

# Bridge mode: guest -> 10.0.0.0/8 keeps its real source.
# Masquerading it made a guest on another worker arrive as that worker's
# 10.x.0.25x address, which the receiving tap's eBPF filter trusts as
# infrastructure, and hid which guest sent it. Infrastructure destinations in
# 10/8 are dropped by the firewall before NAT matters. Inserted at the top of
# POSTROUTING, ahead of the MASQUERADE, and only after the firewall runs:
# without it the exemption would send guest traffic into 10/8 unmasqueraded.
# Routed mode's MASQUERADE already leaves 10/8 out (routed-network.yml).
- name: Keep guest source addresses for internal destinations
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ bridge_subnet }}"
    destination: 10.0.0.0/8
    jump: RETURN
    action: insert
    rule_num: "1"
    state: present
  when: boxd_network_mode | default('bridge') != 'routed'

- name: Persist iptables rules
  apt:
    name: iptables-persistent
    state: present

- name: Save iptables rules
  command: netfilter-persistent save
  changed_when: false

- name: Ensure /dev/kvm exists
  stat:
    path: /dev/kvm
  register: kvm_device

- name: Fail if /dev/kvm not available
  fail:
    msg: "/dev/kvm not found — KVM support required for workers"
  when: not kvm_device.stat.exists

- name: Copy kernel
  boxd_copy:
    src: "{{ boxd_release_dir }}/vmlinux"
    dest: "{{ boxd_data_dir }}/vmlinux"
    mode: preserve
  notify: restart boxd service

- name: Copy initrd
  boxd_copy:
    src: "{{ boxd_release_dir }}/initrd.img"
    dest: "{{ boxd_data_dir }}/initrd.img"
    mode: preserve
  notify: restart boxd service

- name: Copy boxd-vmm
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-vmm"
    dest: "/usr/local/bin/boxd-vmm"
    mode: preserve
  notify: restart boxd service

- name: Set boxd-vmm permissions
  file:
    path: /usr/local/bin/boxd-vmm
    mode: "0755"
    owner: root
    group: root

- name: Set CAP_SYS_ADMIN + CAP_SYS_PTRACE on boxd-vmm
  command: setcap "cap_sys_admin,cap_sys_ptrace+ep" /usr/local/bin/boxd-vmm
  changed_when: false

- name: Copy boxd-vmm-pool
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-vmm-pool"
    dest: /usr/local/bin/boxd-vmm-pool
    mode: preserve
  notify: restart boxd service

- name: Set boxd-vmm-pool permissions
  file:
    path: /usr/local/bin/boxd-vmm-pool
    mode: "0755"
    owner: root
    group: root

- name: Copy boxd-vmexec
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-vmexec"
    dest: /usr/local/bin/boxd-vmexec
    mode: preserve

- name: Set boxd-vmexec permissions
  file:
    path: /usr/local/bin/boxd-vmexec
    mode: "0755"
    owner: root
    group: root

- name: Copy boxd-takeoff
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-takeoff"
    dest: "{{ boxd_data_dir }}/boxd-takeoff"
    mode: preserve

- name: Ensure SDK directory exists
  file:
    path: "{{ boxd_data_dir }}/sdk"
    state: directory
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0755"

- name: Copy boxd-sdk (in-VM CLI)
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-sdk"
    dest: "{{ boxd_data_dir }}/sdk/boxd"
    mode: preserve
  notify: restart boxd service

- name: Copy boxd-automations (in-VM automations supervisor)
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-automations"
    dest: "{{ boxd_data_dir }}/sdk/boxd-automations"
    mode: preserve
  notify: restart boxd service

- name: Copy run (in-VM automations CLI)
  boxd_copy:
    src: "{{ boxd_release_dir }}/boxd-run"
    dest: "{{ boxd_data_dir }}/sdk/run"
    mode: preserve
  notify: restart boxd service

- name: Ship the automations toolkit registry
  # The per-toolkit artifact the worker selects each org's bundle out of.
  # Without it a worker with [automations] configured logs "configured but no
  # registry artifact", every `run` call 503s, and `run list` in a VM is empty.
  boxd_copy:
    src: "{{ boxd_assets_dir }}/automations/automations-registry.tar.gz"
    dest: "{{ boxd_data_dir }}/automations-registry.tar.gz"
    mode: "0644"
  register: boxd_automations_registry

- name: Unpack the automations toolkit registry
  # /var/lib/boxd/automations/registry is COMPILED INTO the worker
  # (boxd-worker automations::REGISTRY_ROOT), so it is boxd_state_dir here and
  # not the worker's data dir. Staging dir + per-version swap mirrors
  # scripts/deploy/worker.sh: a worker reading a bundle mid-converge must never
  # see a half-written tree, and older versions stay in place because bundles
  # already installed in running VMs reference them by version.
  shell: |
    set -e
    incoming={{ boxd_state_dir }}/automations/.registry-incoming
    rm -rf "$incoming"
    mkdir -p "$incoming" {{ boxd_state_dir }}/automations/registry
    tar -xzf {{ boxd_data_dir }}/automations-registry.tar.gz -C "$incoming"
    for v in "$incoming"/*; do
      rm -rf "{{ boxd_state_dir }}/automations/registry/$(basename "$v")"
      mv "$v" {{ boxd_state_dir }}/automations/registry/
    done
    rm -rf "$incoming"
  when: boxd_automations_registry.changed
  notify: restart boxd service

- name: Copy xclip shim (clipboard bridge for VMs)
  copy:
    src: xclip-shim.sh  # vendored in this role's files/
    dest: "{{ boxd_data_dir }}/sdk/xclip-shim"
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0755"
  notify: restart boxd service

- name: Ensure /etc/boxd/tls exists
  file:
    path: /etc/boxd/tls
    state: directory
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0750"

- name: Copy GitHub App private key
  copy:
    src: "{{ boxd_tls_local_dir }}/{{ boxd_github_app_key }}"
    dest: /etc/boxd/tls/github-app.pem
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0600"
  notify: restart boxd service
  when: boxd_github_app_key is defined

- name: Enable and start boxd-worker
  systemd:
    name: boxd-worker
    enabled: true
    state: started
    daemon_reload: true
