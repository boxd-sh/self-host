---
# Bridge networking: a VXLAN tunnel to each worker's bridge, holding this
# proxy's on-link address 10.N.0.(254 - its index) on every worker's /16.

- name: Create VXLAN tunnels to workers
  command: "ip link add vxlan{{ item.vni }} type vxlan id {{ item.vni }} local {{ vrack_ip }} dstport 4789 nolearning"
  loop: "{{ boxd_workers }}"
  register: vxlan_create
  failed_when: vxlan_create.rc != 0 and 'File exists' not in vxlan_create.stderr
  changed_when: vxlan_create.rc == 0

- name: Add FDB entries for workers
  command: "bridge fdb append 00:00:00:00:00:00 dev vxlan{{ item.vni }} dst {{ item.vrack_ip }}"
  loop: "{{ boxd_workers }}"
  changed_when: false
  failed_when: false

- name: Assign IPs on VXLAN interfaces
  command: "ip addr add {{ item.bridge_subnet | regex_replace('0\\.0/16$', '0.' ~ (254 - groups['proxy'].index(inventory_hostname)) | string ~ '/16') }} dev vxlan{{ item.vni }}"
  loop: "{{ boxd_workers }}"
  register: vxlan_ip
  failed_when: vxlan_ip.rc != 0 and 'already assigned' not in vxlan_ip.stderr
  changed_when: vxlan_ip.rc == 0

- name: Bring up VXLAN interfaces
  command: "ip link set vxlan{{ item.vni }} up"
  loop: "{{ boxd_workers }}"
  changed_when: false

- name: Route VM subnets via VXLAN
  command: "ip route replace {{ item.bridge_subnet }} dev vxlan{{ item.vni }}"
  loop: "{{ boxd_workers }}"
  changed_when: false

- name: Install VXLAN startup script
  template:
    src: boxd-vxlan.sh.j2
    dest: /usr/local/bin/boxd-vxlan.sh
    mode: "0755"

- name: Install VXLAN systemd service
  copy:
    content: |
      [Unit]
      Description=boxd VXLAN overlay
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/boxd-vxlan.sh
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/boxd-vxlan.service
    mode: "0644"

- name: Enable VXLAN service
  systemd:
    name: boxd-vxlan
    enabled: true
    daemon_reload: true
