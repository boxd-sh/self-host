---

- name: Install boxd-console service
  import_role:
    name: boxd-common
    tasks_from: install-service
  vars:
    boxd_binary: boxd-console
    boxd_service: boxd-console
    boxd_role_name: console

- name: Create console replica state dir
  file:
    path: /var/lib/boxd/console-replica
    state: directory
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0750"

- name: Create TLS dir
  file:
    path: /etc/boxd/tls
    state: directory
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0750"
  when: boxd_github_app_key is defined

- name: Copy GitHub App private key
  copy:
    src: "{{ boxd_tls_local_dir }}/{{ boxd_github_app_key }}"
    dest: /etc/boxd/tls/github-app.pem
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0600"
  notify: restart boxd service
  when: boxd_github_app_key is defined

- name: Ensure the console directory
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"
    mode: "0755"
  loop:
    - /var/lib/boxd/console

- name: Ship console SPA from assets
  unarchive:
    src: "{{ boxd_assets_dir }}/console.tar.gz"
    dest: /var/lib/boxd/console/
    owner: "{{ boxd_user }}"
    group: "{{ boxd_group }}"

- name: CLI downloads for app.<zone>/downloads
  import_role:
    name: boxd-common
    tasks_from: downloads

- name: Enable and start boxd-console
  systemd:
    name: boxd-console
    enabled: true
    state: started
    daemon_reload: true
